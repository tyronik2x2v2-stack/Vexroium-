name: Get official YSF for SA-MP 0.3.DL

on:
  workflow_dispatch:
  push:
    branches:
      - build-ysf-dl
    paths:
      - .github/workflows/build-ysf-dl.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Download official YSF 2.2 release package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/IS4Code/YSF/releases/download/v2.2/YSF.zip \
            --output YSF.zip
          unzip -l YSF.zip | grep -E 'plugins/YSF_DL\.so$'
          mkdir extracted
          unzip -q YSF.zip -d extracted
          YSF_FILE="$(find extracted -type f -path '*/plugins/YSF_DL.so' -print -quit)"
          test -n "$YSF_FILE"
          test -s "$YSF_FILE"
          cp "$YSF_FILE" YSF_DL.so
          file YSF_DL.so
          readelf -h YSF_DL.so | grep -E 'Class:|Machine:'
          strings YSF_DL.so | grep -m 1 -E 'YSF|0\.3\.DL' || true

      - name: Upload YSF_DL plugin
        uses: actions/upload-artifact@v4
        with:
          name: YSF_DL-linux-plugin
          path: YSF_DL.so
          if-no-files-found: error
          retention-days: 14

name: Inspect Vexorium admin setup

on:
  workflow_dispatch:
  push:
    branches:
      - build-ysf-dl
    paths:
      - .github/workflows/inspect-vexorium-admin.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect admin configuration safely
        shell: bash
        run: |
          set -euo pipefail
          unzip -q vexorium_server.zip -d source
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("source")
          pawn = root / "gamemodes" / "vexoriumrp.pwn"
          sql = root / "dump.sql"
          cfg = root / "scriptfiles" / "config.ini"
          mysql_cfg = root / "scriptfiles" / "mysql_settings.ini"

          print("=== CONFIG FILE SIZES ===")
          for p in (cfg, mysql_cfg):
              print(f"{p}: exists={p.exists()} size={p.stat().st_size if p.exists() else '-'}")

          lines = pawn.read_text(errors="replace").splitlines()
          for start, end, label in [
              (11940, 11990, "ACCOUNT LOAD"),
              (39235, 39265, "SET ADMIN LEVEL"),
              (58385, 58430, "CONNECT / SPECIAL ADMIN"),
              (69590, 69695, "ADMIN ASSIGNMENT BRANCH"),
          ]:
              print(f"=== {label} ===")
              for n in range(start, min(end, len(lines))):
                  print(f"{n+1}: {lines[n][:350]}")

          print("=== ADMIN-RELATED SQL TABLES/COLUMNS ===")
          sql_text = sql.read_text(errors="replace") if sql.exists() else ""
          sql_lines = sql_text.splitlines()
          for i, line in enumerate(sql_lines):
              if re.search(r"CREATE TABLE", line, re.I) and re.search(r"Qelksekm|account|user|player", line, re.I):
                  print(f"schema {i+1}: {line[:500]}")
                  for j in range(i+1, min(i+14, len(sql_lines))):
                      if re.search(r"Admin|NickName|CREATE TABLE|ENGINE=", sql_lines[j], re.I):
                          print(f"{j+1}: {sql_lines[j][:500]}")
              if re.search(r"Stanislav_Belkin", line, re.I):
                  print(f"account match {i+1}: {line[:1200]}")
          print("=== ADMINNAME / CONFIG REFERENCES IN SCRIPT ===")
          for i, line in enumerate(lines):
              if re.search(r"adminname|admin_name|AdminName|config\.ini|mysql_settings", line, re.I):
                  print(f"{i+1}: {line[:350]}")
          PY

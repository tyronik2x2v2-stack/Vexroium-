name: Inspect Vexorium server settings

on:
  push:
    paths:
      - 'inspect-details-trigger.txt'
      - '.github/workflows/inspect-server-details.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read non-secret server settings and dependency names
        shell: bash
        run: |
          set -euo pipefail
          echo "=== SERVER CFG (safe keys only) ==="
          unzip -p vexorium_server.zip server.cfg | awk '
            tolower($1) ~ /^(hostname|maxplayers|bind|port|gamemode0|filterscripts|plugins|announce|query|weburl|maxnpc|onfoot_rate|incar_rate|weapon_rate|stream_distance|stream_rate|mapname|language)$/ {print}
            tolower($1) ~ /^(rcon_password)$/ {print "rcon_password [REDACTED]"}
          '
          echo "=== PAWN INCLUDES ==="
          unzip -p vexorium_server.zip gamemodes/vexoriumrp.pwn | grep -iE '^\s*#(try)?include' | head -n 100 || true
          echo "=== FILTERSCRIPTS ==="
          unzip -Z1 vexorium_server.zip | grep '^filterscripts/' || true
          echo "=== LINUX PLUGIN FILE TYPES ==="
          while IFS= read -r f; do
            case "$f" in
              *.so)
                base=$(basename "$f")
                unzip -p vexorium_server.zip "$f" > "/tmp/$base"
                printf '%s: ' "$f"
                file -b "/tmp/$base"
                ;;
            esac
          done < <(unzip -Z1 vexorium_server.zip)
          echo "=== RELEVANT SCRIPTFILES NAMES ==="
          unzip -Z1 vexorium_server.zip | grep '^scriptfiles/' | sed -n '1,100p' || true

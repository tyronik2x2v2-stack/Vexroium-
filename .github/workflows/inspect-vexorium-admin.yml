name: Inspect Vexorium admin setup

on:
  workflow_dispatch:
  push:
    branches:
      - build-ysf-dl
    paths:
      - .github/workflows/inspect-vexorium-admin.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect admin configuration safely
        shell: bash
        run: |
          set -euo pipefail
          unzip -q vexorium_server.zip -d source
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("source")
          pawn = root / "gamemodes" / "vexoriumrp.pwn"
          sql = root / "dump.sql"
          cfg = root / "scriptfiles" / "config.ini"
          mysql_cfg = root / "scriptfiles" / "mysql_settings.ini"

          def read_text(path):
              raw = path.read_bytes()
              for encoding in ("cp1251", "utf-8", "latin1"):
                  try:
                      return raw.decode(encoding)
                  except UnicodeDecodeError:
                      pass
              return raw.decode("latin1")

          print("=== CONFIG.INI CONTENT ===")
          if cfg.exists():
              print(read_text(cfg)[:5000])
          else:
              print("MISSING")

          print("=== MYSQL SETTINGS (PASSWORD MASKED) ===")
          if mysql_cfg.exists():
              for line in read_text(mysql_cfg).splitlines():
                  if re.search(r"pass|token|secret|key", line, re.I):
                      print(re.sub(r"=.*", "=<masked>", line))
                  else:
                      print(line[:300])

          lines = read_text(pawn).splitlines()
          for start, end, label in [
              (15040, 15090, "MYSQL SETTINGS ENUM/LOADER"),
              (21740, 21790, "CONFIG LOADER A"),
              (21830, 21890, "CONFIG LOADER B"),
              (11960, 11980, "ACCOUNT ADMIN LOAD"),
          ]:
              print(f"=== {label} ===")
              for n in range(start, min(end, len(lines))):
                  print(f"{n+1}: {lines[n][:350]}")

          print("=== ALL ADMIN SETTINGS REFERENCES ===")
          for i, line in enumerate(lines):
              if re.search(r"MySQLSettings\[.*(ADMIN|Admin|admin)|MySQL_Admin|MYSQL_ADMIN|AdminName|adminname", line, re.I):
                  print(f"{i+1}: {line[:350]}")

          print("=== SQL ACCOUNT TABLE ADMIN COLUMN ===")
          if sql.exists():
              sql_lines = read_text(sql).splitlines()
              for i, line in enumerate(sql_lines):
                  if "CREATE TABLE `Qelksekm`" in line:
                      for j in range(i, min(i+30, len(sql_lines))):
                          print(f"{j+1}: {sql_lines[j][:400]}")
          PY
